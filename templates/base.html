<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>

    <title>Admin | Update Employee</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="UTF-8">
    <meta name="description" content="Responsive Admin Dashboard Template" />
    <meta name="keywords" content="admin,dashboard" />
    <meta name="author" content="Steelcoders" />

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="{% static 'assets/plugins/materialize/css/materialize.min.css' %}"/>

    <!-- Material Icons (FIXED HTTPS) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Preloader -->
    <link rel="stylesheet" href="{% static 'assets/plugins/material-preloader/css/materialPreloader.min.css' %}"/>

    <!-- Main Styles -->
    <link rel="stylesheet" href="{% static 'assets/css/alpha.min.css' %}"/>
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}"/>

    <!-- DataTables -->
    <link rel="stylesheet" href="{% static 'assets/plugins/datatables/datatables.min.css' %}"/>

    <!-- jQuery (ONLY ONE VERSION) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        .errorWrap {
            padding: 10px;
            margin: 0 0 20px 0;
            background: #fff;
            border-left: 4px solid #dd3d36;
            box-shadow: 0 1px 1px 0 rgba(0,0,0,.1);
        }

        .succWrap {
            padding: 10px;
            margin: 0 0 20px 0;
            background: #fff;
            border-left: 4px solid #5cb85c;
            box-shadow: 0 1px 1px 0 rgba(0,0,0,.1);
        }
    </style>

</head>

<body>

    {% include 'includes/header.html' %}
    {% include 'includes/sidebar.html' %}

    <!-- MAIN CONTENT -->
    <main class="mn-inner">
        <div class="row">
            <div class="col s12 m12 l12">

                <div class="card">
                    <div class="card-content">

                        {% block content %}
                        {% endblock %}

                    </div>
                </div>

            </div>
        </div>
    </main>

    <div class="right-sidebar-hover"></div>

    <!-- JS -->
    <script src="{% static 'assets/plugins/materialize/js/materialize.min.js' %}"></script>
    <script src="{% static 'assets/plugins/material-preloader/js/materialPreloader.min.js' %}"></script>
    <script src="{% static 'assets/plugins/jquery-blockui/jquery.blockui.js' %}"></script>
    <script src="{% static 'assets/js/alpha.min.js' %}"></script>
    <script src="{% static 'assets/js/pages/form_elements.js' %}"></script>

    <script src="{% static 'assets/plugins/datatables/datatables.min.js' %}"></script>

    <script>
        $(document).ready(function () {
            $('#table_id').DataTable();
        });
    </script>

</body>
</html>
