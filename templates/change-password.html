{% extends 'base.html' %}
{% block content %}

<div class="row">

    <h5 style="color: blue; padding-top: 10px; text-align: center;">
        Change Password
    </h5>

    <form class="col s12" method="post">
        {% csrf_token %}

        <!-- Django Messages FIXED -->
        {% if messages %}
            {% for message in messages %}

                <div class="card-panel 
                    {% if message.tags == 'error' %} red lighten-2 
                    {% else %} green lighten-2 {% endif %}">

                    <span class="white-text">
                        {{ message }}
                    </span>

                </div>

            {% endfor %}
        {% endif %}

        <div class="row">

            <!-- Current Password -->
            <div class="input-field col s12">
                <input type="password" name="cpwd" class="validate" required>
                <label>Current Password</label>
            </div>

            <!-- New Password -->
            <div class="input-field col s12">
                <input type="password" name="npwd" class="validate" required>
                <label>New Password</label>
            </div>

            <!-- Submit Button -->
            <div class="input-field col s12">
                <button type="submit" class="btn indigo waves-effect waves-light">
                    Change Password
                </button>
            </div>

        </div>

    </form>

</div>

{% endblock %}
