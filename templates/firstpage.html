<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>

    <title>Employee Leave Management System | Login Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="UTF-8">

    <meta name="description" content="Employee Leave Management System Login" />
    <meta name="keywords" content="admin, dashboard, login" />

    <!-- Materialize CSS -->
    <link rel="stylesheet" href="{% static 'assets/plugins/materialize/css/materialize.min.css' %}"/>

    <!-- FIXED Google Icons (HTTPS) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'assets/plugins/material-preloader/css/materialPreloader.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/alpha.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}">

</head>

<body class="signin-page">

<div class="mn-content valign-wrapper">

    <main class="mn-inner container">

        <h4 style="text-align:center;">
            Employee Leave Management System
        </h4>

        <div class="valign">

            <div class="row">

                <div class="col s12 m6 l4 offset-l4 offset-m3">

                    <div class="card white">

                        <div class="card-content">

                            <div class="row">

                                <!-- STAFF LOGIN -->
                                <div class="col s12 center" style="margin-bottom:15px;">
                                    <a href="{% url 'staff_login' %}">
                                        <button class="btn teal waves-effect waves-light">
                                            Staff Login
                                        </button>
                                    </a>
                                </div>

                                <!-- ADMIN LOGIN -->
                                <div class="col s12 center">
                                    <a href="{% url 'admin_login' %}">
                                        <button class="btn deep-purple waves-effect waves-light">
                                            Admin Login
                                        </button>
                                    </a>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<!-- JS -->
<script src="{% static 'assets/plugins/jquery/jquery-2.2.0.min.js' %}"></script>
<script src="{% static 'assets/plugins/materialize/js/materialize.min.js' %}"></script>
<script src="{% static 'assets/js/alpha.min.js' %}"></script>

</body>
</html>
