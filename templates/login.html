<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>

    <title>Employee Leave Management System | Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="UTF-8">

    <!-- Materialize -->
    <link rel="stylesheet" href="{% static 'assets/plugins/materialize/css/materialize.min.css' %}"/>

    <!-- FIXED Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'assets/plugins/material-preloader/css/materialPreloader.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/alpha.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/custom.css' %}">

</head>

<body class="signin-page">

<div class="mn-content valign-wrapper">

    <main class="mn-inner container">

        <h4 style="text-align:center;">
            Employee Leave Management System | Login
        </h4>

        <div class="valign">

            <div class="row">

                <div class="col s12 m6 l4 offset-l4 offset-m3">

                    <div class="card">

                        <div class="card-content">

                            <span class="card-title center">Sign In</span>

                            <!-- MESSAGES FIXED -->
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="card-panel
                                        {% if message.tags == 'error' %} red lighten-2
                                        {% else %} green lighten-2 {% endif %}">

                                        <span class="white-text">
                                            {{ message }}
                                        </span>

                                    </div>
                                {% endfor %}
                            {% endif %}

                            <!-- LOGIN FORM -->
                            <form action="{% url 'doLogin' %}" method="POST">
                                {% csrf_token %}

                                <!-- EMAIL -->
                                <div class="input-field">
                                    <input type="email" name="email" required>
                                    <label>Email</label>
                                </div>

                                <!-- PASSWORD -->
                                <div class="input-field">
                                    <input type="password" name="password" required>
                                    <label>Password</label>
                                </div>

                                <!-- BUTTONS -->
                                <div class="row">

                                    <div class="col s6">
                                        <a href="{% url 'firstpage' %}"
                                           class="btn teal waves-effect waves-light full-width">
                                            Home
                                        </a>
                                    </div>

                                    <div class="col s6">
                                        <button type="submit"
                                                class="btn deep-purple waves-effect waves-light full-width">
                                            Login
                                        </button>
                                    </div>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<!-- JS -->
<script src="{% static 'assets/plugins/jquery/jquery-2.2.0.min.js' %}"></script>
<script src="{% static 'assets/plugins/materialize/js/materialize.min.js' %}"></script>
<script src="{% static 'assets/js/alpha.min.js' %}"></script>

</body>
</html>
