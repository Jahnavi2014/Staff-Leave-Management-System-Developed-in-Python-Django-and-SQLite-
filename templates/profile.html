{% extends 'base.html' %}
{% block content %}

<div class="container">

    <h5 style="color: blue; padding-top: 10px;">
        View Your Profile
    </h5>

    <!-- MESSAGES FIXED -->
    {% if messages %}
        {% for message in messages %}

            <div class="card-panel
                {% if message.tags == 'error' %} red lighten-2
                {% else %} green lighten-2 {% endif %}">

                <span class="white-text">
                    {{ message }}
                </span>

            </div>

        {% endfor %}
    {% endif %}

    <div class="row">

        <form method="POST" action="{% url 'profile_update' %}" enctype="multipart/form-data" class="col s12">
            {% csrf_token %}

            <!-- PROFILE PIC -->
            <div class="row">
                <div class="input-field col s12">
                    <input type="file" name="profile_pic">
                </div>
            </div>

            <!-- FIRST NAME -->
            <div class="row">
                <div class="input-field col s12">
                    <input type="text" name="first_name" value="{{ user.first_name }}" required>
                    <label class="active">First Name</label>
                </div>
            </div>

            <!-- LAST NAME -->
            <div class="row">
                <div class="input-field col s12">
                    <input type="text" name="last_name" value="{{ user.last_name }}" required>
                    <label class="active">Last Name</label>
                </div>
            </div>

            <!-- EMAIL (READONLY) -->
            <div class="row">
                <div class="input-field col s12">
                    <input type="email" value="{{ user.email }}" readonly>
                    <label class="active">Email</label>
                </div>
            </div>

            <!-- USERNAME (READONLY) -->
            <div class="row">
                <div class="input-field col s12">
                    <input type="text" value="{{ user.username }}" readonly>
                    <label class="active">Username</label>
                </div>
            </div>

            <!-- SUBMIT -->
            <div class="row">
                <div class="col s12">
                    <button type="submit"
                            class="btn deep-purple waves-effect waves-light">
                        Update Profile
                    </button>
                </div>
            </div>

        </form>

    </div>

</div>

{% endblock %}
